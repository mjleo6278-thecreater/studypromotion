<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개발자 폰</title>
<link rel="stylesheet" href="../fonts/pretendard/pretendard.css">
<style>
  :root { color-scheme: light; --stage-bg: #dbd6cc; }
  html, body { margin: 0; height: 100%; background: var(--stage-bg); overflow: hidden; touch-action: manipulation; }
  #stage { position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 0; top: 0; display: block; }
  #hud { image-rendering: pixelated; pointer-events: none; }
  .hit { position: fixed; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hit:focus-visible { outline: 3px solid #04becd; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl" aria-hidden="true"></canvas><canvas id="hud" aria-hidden="true"></canvas></div>
<div id="hits"></div>
<script src="engine.js"></script>
<script src="pixel.js"></script>
<script src="pawn.js"></script>
<script src="sets.js"></script>
<script src="stage.js"></script>
<script src="character.js"></script>
</body>
</html>
