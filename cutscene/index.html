<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업데이트 이야기 #1</title>
<link rel="stylesheet" href="../fonts/pretendard/pretendard.css">
<style>
  html, body { margin: 0; height: 100%; background: #16181d; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #gl, #hud { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #hud { image-rendering: pixelated; pointer-events: none; }
  #start { position: fixed; inset: 0; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; }
  .hit { position: fixed; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hit:focus-visible, #start:focus-visible { outline: 3px solid #04becd; outline-offset: -3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 600 16px/1.5 "Pretendard Variable", sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="live" class="sr" aria-live="polite"></p>
<div id="hits"></div>
<button id="start" aria-label="업데이트 이야기 보기"></button>
<div id="nogl">이 기기에서는 3D 화면을 그릴 수 없어요.</div>
<script src="engine.js"></script>
<script src="pixel.js"></script>
<script src="pawn.js"></script>
<script src="sets.js"></script>
<script src="stage.js"></script>
<script src="audio.js"></script>
<script src="shower.js"></script>
<script src="player.js"></script>
</body>
</html>
