# 스터디 프로모션 AI 도우미 서버 (Cloudflare Worker, 무료 요금제). 하는 일과 설정 방법: worker/README.md
name = "studypromotion-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
# 서버 주소(studypromotion-ai.<계정>.workers.dev)를 켠다. 브랜치마다 생기는 시험용 주소는 끈다
workers_dev = true
preview_urls = false

# 서버가 남긴 기록(오류 등)을 Cloudflare 화면의 Logs에서 볼 수 있게 한다
[observability]
enabled = true

# Workers AI: 모델을 비밀 키 없이 부른다
[ai]
binding = "AI"

# 사람마다 하루에 쓴 횟수를 센다 (무료 요금제는 SQLite 저장소만 쓸 수 있다)
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# 공개해도 되는 설정. 횟수 제한이 없는 계정(OWNER_EMAILS)은 공개 저장소에 적지 않고 Cloudflare 화면에서 '비밀(Secret)'로 넣는다
[vars]
# 로그인 확인에 쓰는 Firebase 프로젝트
FIREBASE_PROJECT_ID = "studypromotionbyleo"
# 한 사람이 하루에 쓸 수 있는 횟수 (주인 계정은 세지 않는다). 0시 UTC = 한국 오전 9시에 다시 채운다
DAILY_LIMIT = "20"
# "owner" = 주인 계정만 쓸 수 있다(먼저 써 보기). "all" = 로그인한 모든 사람에게 연다
OPEN_TO = "all"
# Workers AI 모델과 답의 최대 길이
MODEL = "@cf/google/gemma-4-26b-a4b-it"
MAX_TOKENS = "2000"
# 모델이 답하기 전에 속으로 생각하게 둘지. "off"가 빠르고, 생각에 답 길이를 다 써서 답이 잘리는 일이 없다
THINKING = "off"
# 앱 주소 (쉼표로 여러 개)
ALLOWED_ORIGINS = "https://mjleo6278-thecreater.github.io"

# OWNER_EMAILS(횟수 제한이 없는 구글 계정 이메일)는 여기에 적지 않는다.
# Cloudflare 화면의 Settings > Variables and Secrets에서 Secret으로 넣는다.
